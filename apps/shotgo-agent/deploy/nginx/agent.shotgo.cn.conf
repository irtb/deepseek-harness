upstream shotgo_agent_gateway {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.shotgo.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.shotgo.cn;

    ssl_certificate /etc/letsencrypt/live/agent.shotgo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.shotgo.cn/privkey.pem;

    access_log /var/log/nginx/agent.shotgo.cn.access.log;
    error_log /var/log/nginx/agent.shotgo.cn.error.log;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://shotgo_agent_gateway;
    }
}
