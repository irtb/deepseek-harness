[program:agent-shotgo]
directory=/data/projects/agent.shotgo.cn
command=/bin/sh -c 'set -a; . /etc/shotgo-agent/shotgo-agent.env; set +a; exec /opt/node-current/bin/node apps/shotgo-agent/dist/gateway-bin.js'
user=www-data
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/projects/agent.shotgo.cn/storage/logs/agent-gateway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=HOME="/data/projects/agent.shotgo.cn/storage",DSH_HOME="/data/projects/agent.shotgo.cn/storage/dsh"
